<head>
<meta charset="UTF-8">

<title>THE SOURCE | JUNE 16, 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  @font-face {
    font-family: 'The Source';
    src: local('The Source 4 Regular'), local('TheSource4-Regular'),
         local('The Source'), local('TheSource');
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: #0a0a0a;
    color: #e8e4df;
    font-family: 'EB Garamond', serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 120%;
    object-fit: cover;
    object-position: center 40%;
    animation: slowDrift 30s ease-in-out infinite alternate;
    filter: brightness(0.55);
  }

  @keyframes slowDrift {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.08) translateY(-2%); }
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,10,10,0.2) 0%,
      rgba(10,10,10,0.0) 40%,
      rgba(10,10,10,0.6) 85%,
      rgba(10,10,10,1) 100%
    );
    z-index: 1;
  }

  .hero-text {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero-text .source-mark {
    font-family: 'The Source', 'EB Garamond', serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.6em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 30px;
    opacity: 0;
    transform: translateY(20px);
    animation: revealUp 1.2s ease forwards 0.2s;
  }

  .hero-text h1 {
    font-family: 'The Source', 'EB Garamond', serif;
    font-size: 7vw;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 0.9;
    color: #fff;
    opacity: 0;
    transform: translateY(40px);
    animation: revealUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
  }

  .hero-text .divider {
    width: 50px;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 28px auto;
    opacity: 0;
    animation: revealUp 1.2s ease forwards 1s;
  }

  .hero-text .regions {
    font-size: 18px;
    font-style: italic;
    color: rgba(255,255,255,0.55);
    margin-top: 16px;
    opacity: 0;
    animation: revealUp 1.2s ease forwards 1.2s;
  }

  @keyframes revealUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .scroll-line {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3));
    z-index: 2;
    opacity: 0;
    animation: revealUp 1s ease forwards 2s;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -1px;
    width: 3px;
    height: 12px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: translateY(0); }
    50% { opacity: 0.2; transform: translateY(-20px); }
  }

  .hero + .content-flow { margin-top: -1px; }

  .content-flow {
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
    gap: 0;
    font-size: 0;
    line-height: 0;
  }

  .content-flow img {
    width: 100%;
    display: block;
    margin: 0;
    padding: 0;
    border: none;
    vertical-align: bottom;
  }

  .parallax-wrap {
    overflow: hidden;
    line-height: 0;
    font-size: 0;
  }

  .parallax-wrap img {
    width: 100%;
    display: block;
    will-change: transform;
    transform: scale(1.15);
  }

  .name-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 40px;
    text-align: center;
    background: #0a0a0a;
    font-size: 16px;
    line-height: 1.4;

    color: rgba(232,228,223,0.2);

  .footer {

    background: #0a0a0a;

  .footer p {
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(232, 228, 223, 0.2);
  }

  @media (max-width: 768px) {
    .hero-text h1 { font-size: 10vw; }
    .name-divider h2 { font-size: 8vw; }
  }
</style>

<!-- ===== JAVASCRIPT ===== -->
<script>
(function() {
  var heroImg = document.querySelector('.hero-img');
  var heroText = document.querySelector('.hero-text');
  window.addEventListener('scroll', function() {
    var scrollY = window.scrollY;
    var vh = window.innerHeight;
    if (scrollY < vh) {
      var progress = scrollY / vh;
      heroText.style.opacity = 1 - progress * 1.5;
      heroText.style.transform = 'translateY(' + (scrollY * 0.3) + 'px)';
      heroImg.style.transform = 'scale(' + (1 + progress * 0.1) + ') translateY(' + (scrollY * 0.15) + 'px)';
    }
  }, { passive: true });
})();

(function() {
  var wraps = document.querySelectorAll('.parallax-wrap');
  var windowH = window.innerHeight;
  window.addEventListener('resize', function() { windowH = window.innerHeight; });
  window.addEventListener('scroll', function() {
    for (var i = 0; i < wraps.length; i++) {
      var rect = wraps[i].getBoundingClientRect();
      if (rect.top < windowH && rect.bottom > 0) {
        var progress = (windowH - rect.top) / (windowH + rect.height);
        var offset = (progress - 0.5) * -60;
        wraps[i].querySelector('img').style.transform = 'scale(1.15) translateY(' + offset + 'px)';
      }
    }
  }, { passive: true });
})();
</script>
